<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clicklease — Apply for Equipment Lease</title>
    <style>
        body { font-family: -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f4f6f8; color: #222; }
        header { background: #14335c; color: #fff; padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; }
        header a { color: #cfe0ff; }
        main { max-width: 620px; margin: 32px auto; background: #fff; padding: 28px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
        label { display: block; font-weight: 600; margin-top: 16px; }
        input { width: 100%; box-sizing: border-box; padding: 9px; margin-top: 4px; border: 1px solid #b9c2cc; border-radius: 4px; font-size: 15px; }
        input:invalid { border-color: #b9c2cc; }
        .error { color: #b3261e; font-size: 13px; margin-top: 3px; display: block; }
        button { margin-top: 24px; width: 100%; padding: 12px; font-size: 16px; font-weight: 600; color: #fff; background: #14335c; border: 0; border-radius: 5px; cursor: pointer; }
        button:disabled { background: #8895a7; cursor: wait; }
        #loading { display: none; margin-top: 14px; text-align: center; color: #14335c; font-weight: 600; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 3px solid #cfd8e6; border-top-color: #14335c; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -3px; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<header>
    <strong>Clicklease — Mini Lease Application</strong>
    <a href="/applications">View applications</a>
</header>
<main>
    <h1>Apply for an equipment lease</h1>
    <form id="applyForm" th:action="@{/applications}" th:object="${applicationForm}" method="post">
        <input type="hidden" th:field="*{idempotencyKey}">

        <label for="businessName">Business name</label>
        <input id="businessName" type="text" th:field="*{businessName}" required>
        <span class="error" th:if="${#fields.hasErrors('businessName')}" th:errors="*{businessName}"></span>

        <label for="ownerName">Owner full name</label>
        <input id="ownerName" type="text" th:field="*{ownerName}" required>
        <span class="error" th:if="${#fields.hasErrors('ownerName')}" th:errors="*{ownerName}"></span>

        <label for="email">Email</label>
        <input id="email" type="email" th:field="*{email}" required>
        <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

        <label for="taxId">Tax ID (EIN)</label>
        <input id="taxId" type="text" th:field="*{taxId}" placeholder="12-3456789"
               pattern="\d{2}-\d{7}" required>
        <span class="error" th:if="${#fields.hasErrors('taxId')}" th:errors="*{taxId}"></span>

        <label for="equipmentDescription">Equipment description</label>
        <input id="equipmentDescription" type="text" th:field="*{equipmentDescription}" required>
        <span class="error" th:if="${#fields.hasErrors('equipmentDescription')}" th:errors="*{equipmentDescription}"></span>

        <label for="amount">Lease amount (USD, $500–$50,000)</label>
        <input id="amount" type="number" th:field="*{amount}" min="500" max="50000" step="0.01" required>
        <span class="error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></span>

        <button id="submitBtn" type="submit">Submit application</button>
        <div id="loading"><span class="spinner"></span>Processing — contacting credit bureau…</div>
    </form>
</main>
<script>
    document.getElementById('applyForm').addEventListener('submit', function (e) {
        if (!e.target.checkValidity()) { return; } // let the browser show inline errors
        document.getElementById('submitBtn').disabled = true;
        document.getElementById('loading').style.display = 'block';
    });
</script>
</body>
</html>
