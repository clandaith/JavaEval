spring.application.name=mini-lease-app
server.port=8080

spring.datasource.url=jdbc:sqlite:./data/lease.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# Mock credit bureau behavior (realistic defaults, overridable for tests)
bureau.failure-rate=0.20
bureau.min-delay-ms=200
bureau.max-delay-ms=3000
bureau.timeout-ms=2000
bureau.call-cost=1.50

logging.level.com.clicklease=INFO
