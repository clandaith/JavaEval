# Unique file per Spring test context — shared-file contexts' in-memory ID
# sequence generators desync when another context drops/recreates the schema.
spring.datasource.url=jdbc:sqlite:./target/test-lease-${random.uuid}.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop

bureau.failure-rate=0.0
bureau.min-delay-ms=1
bureau.max-delay-ms=5
bureau.timeout-ms=1500
bureau.call-cost=1.50
